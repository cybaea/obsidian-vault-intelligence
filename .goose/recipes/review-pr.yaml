version: 1.0.0
title: "Review Renovate Pull Request"
description: "Carefully review, research, locally rebase, and verify a Renovate dependency pull request."
parameters:
  - key: pr_number
    input_type: string
    requirement: required
    description: "The GitHub pull request number to review."
prompt: "Please review, locally rebase, verify (including the Allan-Dev Obsidian vault), and summarize PR {{ pr_number }}"
extensions:
  - type: builtin
    name: developer
  - type: builtin
    name: extensionmanager
  - type: builtin
    name: analyze
  - type: builtin
    name: todo
activities:
  - "Review PR {{ pr_number }}"
instructions: |
  You are an expert developer assistant. Follow these steps meticulously.

  ### Strict Execution Protocol
  - **No Pre-flight Checks**: Do NOT execute environment verification commands (e.g., `which node`, `ls`, `env`, `pwd`) unless a required command fails with a "not found" or permission error.
  - **Trust the Toolchain**: Assume `npm`, `gh`, `git`, and `obsidian` are correctly configured and available in the PATH.
  - **Atomic Steps**: Group related shell commands into single execution blocks to maintain momentum.
  - **No Hallucinations**: If a command fails, report the exact error. Do not speculate about "Hermit" or other environment wrappers unless they appear in the stderr.
  - **Prefer `npm run` commands always**: Watch yourself and when you start using lower-level commands, e.g., `npx vitest run`, STOP AND THINK: it is probably your sandbox or terminal environment that is confused. Review your environment first.

  1. Check for uncommitted changes and switch to the PR branch
     Execute the following shell command to check out PR {{ pr_number }} cleanly:
     `if [ -n "$(git status --porcelain)" ]; then echo "❌ Error: You have uncommitted changes. Please stash or commit them before running this workflow."; exit 1; fi && gh pr checkout {{ pr_number }} --force`

  2. Rebase on main (Local verification only)
     This rebase is for local verification only. DO NOT push the rebased branch to origin, as pushing takes over the PR and stops Renovate from auto-rebasing it.
     If rebase fails due to conflicts, abort immediately to keep the workspace clean. Execute:
     `git fetch origin main && (git rebase origin/main || (echo "❌ Merge Conflict detected! Aborting rebase to clean up..." && git rebase --abort && exit 1))`
     If this step fails with a merge conflict, note in your report that the Renovate Dependency Dashboard checkbox in GitHub should be ticked to rebase/retry the PR.

  3. Identify changed dependencies
     Parse the PR body or `package.json` diff to identify exactly which packages are being upgraded.

  4. Research release notes and breaking changes
     Search the web or the package's changelogs. Look for "breaking changes", "migration guide", or security fixes.
     Include your findings in the final report, especially if there are potential breaking changes or security implications. If the PR is a security fix, identify the CVE or GHSA ID and include it in the report.

  5. Codebase impact analysis
     Use your tools to search the codebase (e.g., `grep` or search features) to find usage of affected APIs if breaking changes are suspected.

  6. Automated Verification Suite
     Run the build, test, lint, and docs suite using `npm ci` to respect the lockfile. Execute:
     `npm ci && npm run build && npm test && npm run lint && npm run docs:build`
     If any of these steps fail, record the exact error messages for your report. Do NOT attempt to fix the errors yourself.

  7. Obsidian `Allan-Dev` Vault Console Check
     Only run this step if Step 6 (`npm run build`) succeeded. Attach the debugger, reload the freshly built plugin in `Allan-Dev`, inspect errors, and detach:
     ```bash
     PLUGIN_ID=$(node -p "require('./manifest.json').id")
     if ! pgrep -x obsidian >/dev/null 2>&1; then
       nohup obsidian >/dev/null 2>&1 &
       sleep 5
     fi
     obsidian vault="Allan-Dev" dev:debug on
     obsidian vault="Allan-Dev" plugin:reload id="$PLUGIN_ID"
     sleep 3
     obsidian vault="Allan-Dev" dev:errors
     obsidian vault="Allan-Dev" dev:console level=error
     obsidian vault="Allan-Dev" dev:debug off
     ```
     - If `dev:errors` or `dev:console level=error` outputs any plugin errors—or if the `obsidian` CLI command fails—record the exact output and treat the Obsidian check as failed.

  8. Report Findings on GitHub
     Post the summary as a comment on the PR using `gh pr comment`.
     a. Write your detailed findings to a temporary file named `pr_summary.txt`:
        - Include a section: "**Local Rebase & Verification**: Rebased locally on `main`; automated build, test, lint, and docs checks [passed/failed]."
        - Include a section: "**Obsidian `Allan-Dev` Console Check**: Reloaded plugin in `Allan-Dev`; [zero console errors detected / list errors]."
        - If this is a security fix, include a section: "**Changelog Entry**: Provide the entry for the `### Security` section, including the CVE/GHSA ID."
     b. Execute the following to post the comment and clean up:
        `gh pr comment {{ pr_number }} --body-file pr_summary.txt && rm pr_summary.txt`

  9. Cleanup
     Switch back to `main` and delete the local PR branch so the workspace stays clean:
     `git checkout main`

  10. Write Machine-Readable Verdict File
      Write a valid JSON file to `/tmp/goose-verdict-{{ pr_number }}.json` with these exact fields:
      - `pr_number`: {{ pr_number }} (integer)
      - `safe_to_merge`: `true` ONLY if local rebase succeeded, all commands in Step 6 passed, Obsidian `Allan-Dev` reloaded with zero errors in Step 7, and no unmitigated breaking changes were found; otherwise `false` (boolean)
      - `risk_level`: `"low"` for patch/minor updates with clean checks; `"medium"` for major version bumps or broad dependency updates that passed all checks; `"high"` if any check failed, breaking changes affect used APIs, or Obsidian reported errors (string)
      - `requires_manual_ui_check`: `true` if the upgraded package directly affects UI rendering, CSS, or Obsidian workspace views; otherwise `false` (boolean)
      - `security_advisory`: The CVE or GHSA ID if this PR addresses a vulnerability, otherwise `""` (string)
      - `summary`: A concise 1–2 sentence summary of the dependency change, test/Obsidian results, and recommendation (string)

      Validate the written file via shell:
      ```bash
      node -e '
        const v = JSON.parse(require("fs").readFileSync("/tmp/goose-verdict-{{ pr_number }}.json", "utf8"));
        const req = ["pr_number", "safe_to_merge", "risk_level", "requires_manual_ui_check", "security_advisory", "summary"];
        for (const k of req) if (!(k in v)) throw new Error("Missing key: " + k);
        if (typeof v.pr_number !== "number" || typeof v.safe_to_merge !== "boolean" || typeof v.requires_manual_ui_check !== "boolean") throw new Error("Invalid type");
        if (!["low", "medium", "high"].includes(v.risk_level)) throw new Error("Invalid risk_level");
        console.log("VERDICT_OK");
      '
      ```
      Once `VERDICT_OK` prints, conclude your response normally. Do NOT attempt to call `final_output`.

